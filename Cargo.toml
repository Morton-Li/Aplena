[workspace]
members = ["crates/pfcm-domain", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
csv = "1.4.0"
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.25.0", features = ["serde", "v4"] }
zip = { version = "8.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
