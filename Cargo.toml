[workspace]
members = ["crates/pfcm-domain", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Morton-Li/Aplena"

[workspace.dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
flate2 = "1.1.9"
libc = "0.2.189"
minisign-verify = "0.2.5"
plist = "1.8.0"
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tar = "0.4.44"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-updater = "=2.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.25.0", features = ["serde", "v4"] }
